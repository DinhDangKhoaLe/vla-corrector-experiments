# MetaWorld adaptation; provenance and differences: docs/dynamic_horizon_sources.md
method: a3
dataset: datasets/metaworld_mt50
policy:
  checkpoint: pretrained_weights/pi05_metaworld_compat
  tokenizer_model: ~/.cache/openpi/big_vision/paligemma_tokenizer.model
  device: cuda
  dtype: bfloat16  # memory-saving comparison default; use float32 if preferred with enough GPU memory
  denoising_steps: 10
evaluation:
  seed: 1000
  tasks: easy,medium,hard,very_hard
  episodes_per_task: 20
  episode_length: 300
  prediction_horizon: 50
  max_execution_horizon: 50
  camera: corner2
  output: outputs/dynamic_horizon/a3/evaluation_seed1000
settings:
  samples: 8
  confidence_epsilon: 0.00000001
  delta_thresholds: [2.0, 2.0, 3.4]  # released MetaWorld XYZ thresholds; decoded command units
