# Plain fine-tuned PI0.5, using the same native 15-task RoboTwin evaluation protocol.
# The cache supplies task names only: no Corrector checkpoint or latents are loaded.
features:
  action_prefix: false
  uncertainty_monitor: false
training:
  backend: legacy
  cache: outputs/robotwin_pi05_hard15_latents_3cam_grid8
  output: outputs/unused_robotwin_pi05_baseline
  device: cuda
evaluation:
  policy: pretrained_weights/robotwin_pi05_vanilla_compat
  checkpoint: ''
  output: outputs/eval/robotwin_hard15_pi05_baseline
  robotwin_corrector_enabled: false
  robotwin_scene_manifest: outputs/eval/robotwin_hard15_seed1000_scene_manifest.json
  robotwin_tasks: hanging_mug,move_stapler_pad,handover_block,click_bell,place_cans_plasticbox,place_mouse_pad,put_object_cabinet,blocks_ranking_size,move_pillbottle_pad,scan_object,turn_switch,stamp_seal,place_can_basket,move_can_pot,place_bread_basket
  episodes: 20
  seed: 1000
  n_action_steps: 10
  chunk_size: 50
  guidance: false
  guidance_eta: 0.0
  save_video: false
