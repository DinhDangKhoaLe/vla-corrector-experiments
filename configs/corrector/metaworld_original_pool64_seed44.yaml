# Repeat the 8x8 original run with training seed 44; evaluation seed stays 1000.
features:
  action_prefix: false
  uncertainty_monitor: false
model:
  image_token_grid_size: 8
  horizons: [10]
training:
  backend: legacy
  cache: outputs/metaworld_mt50_pi05_latents_pool64
  cache_location: gpu
  output: outputs/experiments/metaworld_original_pool64_seed44
  seed: 44
  epochs: 30
  batch_size: 512
  microbatch_size: 64
  lr: 0.0003
  weight_decay: 0.0001
  patience: 5
  val_fraction: 0.1
  test_fraction: 0.1
evaluation:
  policy: pretrained_weights/pi05_metaworld_eval_compat
  checkpoint: outputs/experiments/metaworld_original_pool64_seed44/h1_k10/best_cosine_model.pt
  output: outputs/experiments/eval_metaworld_original_pool64_seed44
  tasks: easy,medium,hard,very_hard
  episodes: 20
  seed: 1000
  n_action_steps: 10
  chunk_size: 50
  guidance: true
  guidance_eta: 1.0
  cooldown_steps: 10
  save_video: true
