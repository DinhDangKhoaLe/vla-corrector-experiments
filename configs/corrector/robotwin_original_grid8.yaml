# Paper-code Original VLA Corrector ported to RoboTwin with an 8x8 latent
# pooling ablation. RoboTwin was not an original-paper benchmark.
features:
  action_prefix: false
  uncertainty_monitor: false
model:
  image_token_grid_size: 8
  robotwin_camera_mode: three
  horizons: [10]
  widths: [2048, 2048, 2048, 2048]
  action_embed_dim: 256
  dropout: 0.0
training:
  backend: legacy
  cache: outputs/robotwin_pi05_hard15_latents_3cam_grid8
  output: outputs/robotwin_hard15_original_corrector_grid8
  device: cuda
  batch_size: 512
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0001
  patience: 5
  seed: 42
  val_fraction: 0.1
  test_fraction: 0.1
evaluation:
  policy: pretrained_weights/robotwin_pi05_vanilla_compat
  robotwin_root: third_party/RoboTwin
  robotwin_task_config: demo_clean
  robotwin_tasks: hanging_mug,move_stapler_pad,handover_block,click_bell,place_cans_plasticbox,place_mouse_pad,put_object_cabinet,blocks_ranking_size,move_pillbottle_pad,scan_object,turn_switch,stamp_seal,place_can_basket,move_can_pot,place_bread_basket
  robotwin_expert_check: true
  robotwin_corrector_enabled: true
  robotwin_scene_manifest: outputs/eval/robotwin_hard15_seed1000_scene_manifest.json
  checkpoint: outputs/robotwin_hard15_original_corrector_grid8/h1_k10
  output: outputs/eval/robotwin_hard15_original_corrector_grid8
  episodes: 20
  seed: 1000
  n_action_steps: 10
  chunk_size: 50
  guidance: true
  guidance_eta: 1.0
  cooldown_steps: 10
  save_video: false
