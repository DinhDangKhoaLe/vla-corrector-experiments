# Ordered action-prefix Corrector with 32 mean-pooled visual tokens.
features:
  action_prefix: true
model:
  image_token_grid_shape: [4, 8]
  horizons: [10]
training:
  cache: outputs/metaworld_mt50_pi05_latents_pool32
  output: outputs/experiments/metaworld_prefix_pool32
evaluation:
  output: outputs/experiments/eval_metaworld_prefix_pool32
  tasks: easy,medium,hard,very_hard
  episodes: 20
